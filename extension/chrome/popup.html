<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<style>
  body { font: 13px -apple-system, system-ui, sans-serif; width: 260px; margin: 14px; color: #222; }
  h1 { font-size: 14px; margin: 0 0 10px; }
  .row { display: flex; align-items: center; gap: 8px; margin: 6px 0; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: #bbb; flex: none; }
  .ok .dot { background: #2fb344; }
  .bad .dot { background: #d63939; }
  .muted { color: #777; font-size: 12px; line-height: 1.5; }
  button { width: 100%; margin-top: 4px; padding: 7px 10px; font: inherit; border-radius: 7px; border: 1px solid #ccc; background: #f6f6f6; cursor: pointer; }
  button:disabled { opacity: .6; cursor: default; }
  @media (prefers-color-scheme: dark) { body { background: #222; color: #eee; } .muted { color: #aaa; } button { background: #333; color: #eee; border-color: #555; } }
</style>
</head>
<body>
  <h1>🐳 鲸醒</h1>
  <div id="status" class="row"><span class="dot"></span><span id="text">正在连接本机 App…</span></div>
  <p id="scope" class="muted"></p>
  <button id="fav">⭐ 收藏这一页并提取要点</button>
  <p id="favStatus" class="muted">快捷键 ⌥⇧S。要点会出现在鲸醒的“收藏”页。</p>
  <p class="muted">记录范围在 App 菜单“设置… → 内容记录”里修改。数据只保存在这台电脑上。</p>
  <script src="popup.js"></script>
</body>
</html>
