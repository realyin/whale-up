# 免费版（个人免费开发者账号也能签名）：Safari 扩展 + 快捷指令自动化。xcodegen generate --spec project-lite.yml
name: WhaleUpLite
options:
  bundleIdPrefix: io.github.realyin.whaleup.lite
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    # 换成你自己的开发者团队 ID（钥匙串里 Apple Development 证书的 OU）
    DEVELOPMENT_TEAM: 79DV8NKV89
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: 0.1.0
    CURRENT_PROJECT_VERSION: 1
    TARGETED_DEVICE_FAMILY: "1"

targets:
  WhaleUpLite:
    type: application
    platform: iOS
    sources:
      - Lite/App
      - path: Shared/Theme.swift
      - path: App/Resources
      - path: App/Assets.xcassets
    info:
      path: Lite/App/Info.plist
      properties:
        CFBundleDisplayName: 鲸醒
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.realyin.whaleup.lite
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - target: SafariExtension

  SafariExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: Lite/SafariExtension/SafariWebExtensionHandler.swift
      # 扩展的网页文件放在扩展包的根目录（包里不能有叫 Resources 的文件夹），图片保留 images/ 子目录
      - path: Lite/SafariExtension/Resources
        excludes: ["images/**"]
        buildPhase: resources
      - path: Lite/SafariExtension/Resources/images
        type: folder
        buildPhase: resources
    info:
      path: Lite/SafariExtension/Info.plist
      properties:
        CFBundleDisplayName: 鲸醒
        NSExtension:
          NSExtensionPointIdentifier: com.apple.Safari.web-extension
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).SafariWebExtensionHandler
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.realyin.whaleup.lite.safari
